<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="-6" cy="552" r="25" fill="#047857" opacity="0.13"/>
    <circle cx="788" cy="569" r="41" fill="#047857" opacity="0.13"/>
    <circle cx="1298" cy="375" r="53" fill="#047857" opacity="0.15"/>
    <circle cx="434" cy="605" r="56" fill="#047857" opacity="0.06"/>
    <circle cx="654" cy="313" r="94" fill="#047857" opacity="0.08"/>
    <circle cx="530" cy="390" r="23" fill="#047857" opacity="0.11"/>
    <rect x="1111" y="90" width="81" height="65" rx="8" fill="#059669" opacity="0.05" transform="rotate(38, 503, 215)"/>
    <rect x="985" y="9" width="92" height="77" rx="8" fill="#059669" opacity="0.09" transform="rotate(44, 718, 565)"/>
    <rect x="695" y="165" width="90" height="26" rx="8" fill="#059669" opacity="0.08" transform="rotate(11, 644, 609)"/>
    <rect x="-74" y="400" width="40" height="41" rx="8" fill="#059669" opacity="0.13" transform="rotate(0, -62, 695)"/>
    <rect x="780" y="437" width="54" height="71" rx="8" fill="#059669" opacity="0.07" transform="rotate(13, 676, 286)"/>
    <rect x="588" y="161" width="25" height="46" rx="8" fill="#059669" opacity="0.09" transform="rotate(38, 795, 634)"/>
    <rect x="295" y="196" width="70" height="81" rx="8" fill="#059669" opacity="0.08" transform="rotate(4, 1250, 476)"/>
    <rect x="294" y="24" width="65" height="91" rx="8" fill="#059669" opacity="0.11" transform="rotate(27, 1166, -26)"/>
    <polygon points="993,196 1023,256 963,256" fill="#047857" opacity="0.09"/>
    <polygon points="746,175 807,297 685,297" fill="#047857" opacity="0.11"/>
    <polygon points="601,612 693,796 509,796" fill="#047857" opacity="0.09"/>
    <polygon points="145,187 218,333 72,333" fill="#047857" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,546 C360,588 840,504 1200,546 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    백링크 자동화 프로그램
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — LLM비교
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 백링크 자동화 프로그램 — LLM비교
  </text>
</svg>